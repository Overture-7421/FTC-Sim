name: Release

# Builds FTC-Sim for Windows and publishes a GitHub release with its installer, its zip and their checksums.
#
#   - Run this workflow (Actions, Release, Run workflow) with a version like 1.2.3. It creates the tag v1.2.3 on the commit it runs
#     on and a release for it; nothing else makes a release, and pushing a tag by hand does not.
#   - The release holds FTC-Sim-<version>-Setup.exe (the installer, which installs for the current user without administrator
#     rights), FTC-Sim-<version>.zip (the unzip-and-run folder) and SHA256SUMS.txt.
#   - Installed copies of FTC-Sim look at the latest release, offer a newer version in their window and, when the person says so,
#     fetch FTC-Sim-<version>-Setup.exe, check it against SHA256SUMS.txt and run it. The file names below are what they look for
#     (dev.ftcsim.app.update.GitHubUpdater); ReleaseFilesTest keeps the two in step. Details: docs/architecture/updates.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.2.3 or 1.3.0-rc.1 (a version with a hyphen is a pre-release, which installed copies never offer). The tag v<version> is created."
        required: true
        type: string
      run_checks:
        description: "Run the whole test suite first (about 5 minutes)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Work out the version and make sure it is new
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:BRANCH -ne $env:DEFAULT_BRANCH) { throw "Releases are made from $env:DEFAULT_BRANCH, not from $env:BRANCH: run the workflow on $env:DEFAULT_BRANCH." }
          $version = $env:INPUT_VERSION.Trim() -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "'$($env:INPUT_VERSION)' is not a version like 1.2.3 or 1.2.3-rc.1" }
          $tag = "v$version"
          if (git ls-remote --tags origin "refs/tags/$tag") { throw "The tag $tag already exists: choose a new version." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        if: inputs.run_checks
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew.bat --no-daemon check "-PappVersion=$env:VERSION"

      - name: Build the distribution
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew.bat --no-daemon :app:dist "-PappVersion=$env:VERSION"

      - name: Self test of the distribution
        run: |
          & .\app\build\dist\FTC-Sim\FTC-Sim.cmd --self-test
          if ($LASTEXITCODE -ne 0) { throw "the self test of the distribution failed ($LASTEXITCODE)" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $source = (Resolve-Path .\app\build\dist\FTC-Sim).Path
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$source" "/DOutputDir=$PWD\release" .\app\installer\FTC-Sim.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - name: Try the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = ".\release\FTC-Sim-$env:VERSION-Setup.exe"
          $target = Join-Path $env:RUNNER_TEMP 'FTC-Sim-installed'
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORUN=1', "/DIR=$target" -Wait
          & "$target\FTC-Sim.cmd" --self-test
          if ($LASTEXITCODE -ne 0) { throw "the self test of the installed program failed ($LASTEXITCODE)" }
          Start-Process "$target\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          if (Test-Path "$target\FTC-Sim.cmd") { throw 'the uninstaller left the program behind' }

      - name: Collect the files of the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Copy-Item .\app\build\dist\FTC-Sim.zip ".\release\FTC-Sim-$env:VERSION.zip"
          $files = Get-ChildItem .\release -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name
          $lines = $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$PWD\release\SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content .\release\SHA256SUMS.txt

      - name: Keep the files with the run
        uses: actions/upload-artifact@v4
        with:
          name: FTC-Sim-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $files = Get-ChildItem .\release -File | ForEach-Object { $_.FullName }
          # The tag does not exist yet: GitHub creates it on this commit together with the release.
          $arguments = @('release', 'create', $env:TAG) + $files + @('--title', "FTC-Sim $env:VERSION", '--generate-notes', '--target', $env:GITHUB_SHA)
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
