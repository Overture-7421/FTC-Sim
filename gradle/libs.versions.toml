[versions]
# The JDK that builds, tests and runs everything: the java toolchain reads this, and the Gradle daemon is held to the
# same version by gradle/gradle-daemon-jvm.properties (regenerate it with `gradlew updateDaemonJvm --jvm-version=<this>`).
jdk = "25"
junit = "6.1.3"
joltJni = "7.0.0"
kotlin = "2.4.21"
composeMultiplatform = "1.12.2"
composeMaterial3 = "1.12.0-alpha03"
composeIconsCore = "1.7.3"
coroutines = "1.11.0"
lwjgl = "3.4.3"
ftcSdk11 = "11.1.0"
# The other published SDK 11 releases, which the acceptance tests also run on (-PftcSdk=<version>).
ftcSdk11First = "11.0.0"
ftcSdk11Second = "11.2.0"
ftcSdk11Last = "11.2.1"
ftcSdk12 = "12.0.0"
androidxAnnotation = "1.9.1"
asm = "9.11.1"
jackson = "2.23.0"
androidJson = "0.0.20131108.vaadin1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jolt-jni = { module = "com.github.stephengold:jolt-jni-Windows64", version.ref = "joltJni" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "composeIconsCore" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
lwjgl-core = { module = "org.lwjgl:lwjgl" }
lwjgl-glfw = { module = "org.lwjgl:lwjgl-glfw" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl" }
androidx-annotation = { module = "androidx.annotation:annotation-jvm", version.ref = "androidxAnnotation" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
# Android's own org.json (Apache 2.0, extracted from AOSP): the platform API that the SDK's Limelight classes parse with.
android-json = { module = "com.vaadin.external.google:android-json", version.ref = "androidJson" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
